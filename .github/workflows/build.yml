name: FileFlow - build e release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fileflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win --x64 --publish never
      - name: Guardar .exe
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  android:
    name: APK Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Build web
        run: npm run build:renderer
      - name: Inicializar projeto Android
        run: npx cap add android
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Guardar .apk
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [windows, android]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Definir versão
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -la release
      - name: Remover releases anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" 2>/dev/null || true
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: FileFlow ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            release/*.exe
            release/*.apk
          body: |
            ## Como instalar

            **Windows**
            - **FileFlow-Setup-${{ env.VERSION }}.exe**: instalador (recomendado). Cria atalho na área de trabalho e no menu Iniciar.
            - **FileFlow-Portatil-${{ env.VERSION }}.exe**: versão portátil, roda sem instalar.

            Na primeira vez, o Windows pode mostrar "O Windows protegeu o computador", porque o app não tem certificado de assinatura. Clique em **Mais informações → Executar assim mesmo**.

            **Android**
            - **FileFlow-debug.apk**: instale no celular. Habilite "Fontes desconhecidas" nas configurações do Android (Configurações → Segurança → Instalar apps desconhecidos).
